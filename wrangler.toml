name = "astro"
compatibility_date = "2024-09-23"
compatibility_flags = [ "nodejs_compat" ]

[assets]
directory = "./dist/client"

# Run: npx wrangler kv namespace create STORE_KV
# Then replace PLACEHOLDER_KV_ID with your KV namespace ID below
[[kv_namespaces]]
binding = "STORE_KV"
id = "PLACEHOLDER_KV_ID"
